---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
  namespace: identity
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  labels:
    app.kubernetes.io/name: keycloak
    app.kubernetes.io/component: identity-provider
    app.kubernetes.io/part-of: shopping-cart
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: keycloak
  template:
    metadata:
      labels:
        app.kubernetes.io/name: keycloak
        app.kubernetes.io/component: identity-provider
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      initContainers:
      - name: realm-import
        image: quay.io/keycloak/keycloak:24.0
        command:
        - /bin/bash
        - -euo
        - pipefail
        - -c
        - |
          until bash -lc '</dev/tcp/postgres-keycloak.identity.svc.cluster.local/5432' >/dev/null 2>&1; do
            echo "Waiting for postgres-keycloak..."
            sleep 5
          done

          escape_sed() {
            printf '%s' "$1" | sed -e 's/[\/&]/\\&/g'
          }

          render_realm() {
            local input_file="/realm/realm-shopping-cart.json"
            local output_file="/tmp/realm-shopping-cart.rendered.json"
            local argocd_client_secret order_service_client_secret product_catalog_client_secret grafana_client_secret ldap_bind_credential

            argocd_client_secret="$(escape_sed "${ARGOCD_CLIENT_SECRET}")"
            order_service_client_secret="$(escape_sed "${ORDER_SERVICE_CLIENT_SECRET}")"
            product_catalog_client_secret="$(escape_sed "${PRODUCT_CATALOG_CLIENT_SECRET}")"
            grafana_client_secret="$(escape_sed "${GRAFANA_CLIENT_SECRET}")"
            ldap_bind_credential="$(escape_sed "${LDAP_BIND_CREDENTIAL}")"

            sed               -e "s/\${ARGOCD_CLIENT_SECRET}/${argocd_client_secret}/g"               -e "s/\${ORDER_SERVICE_CLIENT_SECRET}/${order_service_client_secret}/g"               -e "s/\${PRODUCT_CATALOG_CLIENT_SECRET}/${product_catalog_client_secret}/g"               -e "s/\${GRAFANA_CLIENT_SECRET}/${grafana_client_secret}/g"               -e "s/\${LDAP_BIND_CREDENTIAL}/${ldap_bind_credential}/g"               "${input_file}" > "${output_file}"

            /opt/keycloak/bin/kc.sh import --file "${output_file}" --db=postgres --override=true
          }

          render_realm
        envFrom:
        - configMapRef:
            name: keycloak-config
        - secretRef:
            name: keycloak-secrets
        env:
        - name: ARGOCD_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: keycloak-client-secrets
              key: argocd-client-secret
        - name: ORDER_SERVICE_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: keycloak-client-secrets
              key: order-service-client-secret
        - name: PRODUCT_CATALOG_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: keycloak-client-secrets
              key: product-catalog-client-secret
        - name: GRAFANA_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: keycloak-client-secrets
              key: grafana-client-secret
        volumeMounts:
        - name: keycloak-realm-import
          mountPath: /realm
          readOnly: true
      containers:
      - name: keycloak
        image: quay.io/keycloak/keycloak:24.0
        args:
        - start
        - --db=postgres
        ports:
        - name: http
          containerPort: 8080
        - name: https
          containerPort: 8443
        envFrom:
        - configMapRef:
            name: keycloak-config
        - secretRef:
            name: keycloak-secrets
        resources:
          requests:
            cpu: 200m
            memory: 512Mi
          limits:
            cpu: 1000m
            memory: 1Gi
        livenessProbe:
          httpGet:
            path: /health/live
            port: http
          initialDelaySeconds: 60
          periodSeconds: 30
          timeoutSeconds: 10
        readinessProbe:
          httpGet:
            path: /health/ready
            port: http
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
        startupProbe:
          httpGet:
            path: /health/started
            port: http
          initialDelaySeconds: 30
          periodSeconds: 10
          failureThreshold: 30
      volumes:
      - name: keycloak-realm-import
        configMap:
          name: keycloak-realm-import
---
apiVersion: v1
kind: Service
metadata:
  name: keycloak
  namespace: identity
  labels:
    app.kubernetes.io/name: keycloak
    app.kubernetes.io/component: identity-provider
spec:
  type: ClusterIP
  ports:
  - name: http
    port: 80
    targetPort: http
  - name: https
    port: 443
    targetPort: https
  selector:
    app.kubernetes.io/name: keycloak
---
# NodePort for development access
apiVersion: v1
kind: Service
metadata:
  name: keycloak-nodeport
  namespace: identity
  labels:
    app.kubernetes.io/name: keycloak
    app.kubernetes.io/component: identity-provider
spec:
  type: NodePort
  ports:
  - name: http
    port: 80
    targetPort: http
    nodePort: 30080
  selector:
    app.kubernetes.io/name: keycloak
