# ExternalSecret: k3dm-smoke-user
# Seeded by k3d-manager keycloak_seed_smoke_user.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: k3dm-smoke-user
  namespace: identity
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  labels:
    app.kubernetes.io/name: k3dm-smoke-user
    app.kubernetes.io/instance: k3dm-smoke-user
    app.kubernetes.io/component: identity-credentials
    app.kubernetes.io/part-of: shopping-cart
spec:
  refreshInterval: 15m
  secretStoreRef:
    name: vault-kv-store
    kind: SecretStore
  target:
    name: k3dm-smoke-user
    creationPolicy: Owner
    template:
      type: Opaque
      metadata:
        labels:
          app.kubernetes.io/name: k3dm-smoke-user
          app.kubernetes.io/instance: k3dm-smoke-user
          app.kubernetes.io/component: identity-credentials
          app.kubernetes.io/part-of: shopping-cart
  data:
    - secretKey: username
      remoteRef:
        key: secret/data/keycloak/smoke-user
        property: username
    - secretKey: password
      remoteRef:
        key: secret/data/keycloak/smoke-user
        property: password
    - secretKey: realm
      remoteRef:
        key: secret/data/keycloak/smoke-user
        property: realm
    - secretKey: client
      remoteRef:
        key: secret/data/keycloak/smoke-user
        property: client
