---
apiVersion: batch/v1
kind: Job
metadata:
  name: keycloak-realm-reconcile
  namespace: identity
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
  labels:
    app.kubernetes.io/name: keycloak-realm-reconcile
    app.kubernetes.io/component: identity-provider
    app.kubernetes.io/part-of: shopping-cart
spec:
  backoffLimit: 1
  activeDeadlineSeconds: 900
  template:
    metadata:
      labels:
        app.kubernetes.io/name: keycloak-realm-reconcile
        app.kubernetes.io/component: identity-provider
        app.kubernetes.io/part-of: shopping-cart
    spec:
      restartPolicy: Never
      volumes:
      - name: keycloak-realm-import
        configMap:
          name: keycloak-realm-import
      containers:
      - name: reconcile
        image: quay.io/keycloak/keycloak:24.0
        command:
        - /bin/bash
        - -euo
        - pipefail
        - -c
        - |
          # shellcheck shell=bash
          # shellcheck disable=SC2153
          escape_sed() {
            printf '%s' "$1" | sed -e 's/[\/&]/\\&/g'
          }

          render_realm() {
            local input_file="/realm/realm-shopping-cart.json"
            local output_file="/tmp/realm-shopping-cart.rendered.json"
            local argocd_client_secret order_service_client_secret product_catalog_client_secret grafana_client_secret ldap_bind_credential

            argocd_client_secret="$(escape_sed "${ARGOCD_CLIENT_SECRET}")"
            order_service_client_secret="$(escape_sed "${ORDER_SERVICE_CLIENT_SECRET}")"
            product_catalog_client_secret="$(escape_sed "${PRODUCT_CATALOG_CLIENT_SECRET}")"
            grafana_client_secret="$(escape_sed "${GRAFANA_CLIENT_SECRET}")"
            ldap_bind_credential="$(escape_sed "${LDAP_BIND_CREDENTIAL}")"

            sed \
              -e "s/\${ARGOCD_CLIENT_SECRET}/${argocd_client_secret}/g" \
              -e "s/\${ORDER_SERVICE_CLIENT_SECRET}/${order_service_client_secret}/g" \
              -e "s/\${PRODUCT_CATALOG_CLIENT_SECRET}/${product_catalog_client_secret}/g" \
              -e "s/\${GRAFANA_CLIENT_SECRET}/${grafana_client_secret}/g" \
              -e "s/\${LDAP_BIND_CREDENTIAL}/${ldap_bind_credential}/g" \
              "${input_file}" > "${output_file}"
          }

          deadline_seconds="${KEYCLOAK_RECONCILE_TIMEOUT_SECONDS:-900}"
          deadline_epoch="$(($(date +%s) + deadline_seconds))"

          until bash -lc '</dev/tcp/keycloak.identity.svc.cluster.local/80' >/dev/null 2>&1; do
            if [ "$(date +%s)" -ge "${deadline_epoch}" ]; then
              echo "Timed out waiting for Keycloak service"
              exit 1
            fi
            echo "Waiting for Keycloak service..."
            sleep 5
          done

          render_realm

          /opt/keycloak/bin/kcadm.sh config credentials \
            --server http://keycloak.identity.svc.cluster.local \
            --realm master \
            --user "${KEYCLOAK_ADMIN}" \
            --password "${KEYCLOAK_ADMIN_PASSWORD}" >/dev/null

          if /opt/keycloak/bin/kcadm.sh get "realms/${KC_REALM}" >/dev/null 2>&1; then
            echo "Realm ${KC_REALM} exists; applying partial import"
          else
            echo "Realm ${KC_REALM} missing; creating realm shell"
            /opt/keycloak/bin/kcadm.sh create realms -s "realm=${KC_REALM}" -s enabled=true >/dev/null
          fi

          _pi_rc=0
          /opt/keycloak/bin/kcadm.sh create partialImport \
            -r "${KC_REALM}" \
            -s ifResourceExists=OVERWRITE \
            -f /tmp/realm-shopping-cart.rendered.json || _pi_rc=$?
          if [[ ${_pi_rc} -ne 0 ]]; then
            echo "Warning: partialImport exited ${_pi_rc} (re-run duplicate-key is expected); continuing with LDAP setup"
          fi

          _strip_quotes() {
            local s="$1"
            s="${s#\"}"
            s="${s%\"}"
            printf '%s' "${s}"
          }

          csv_value() {
            local csv="$1" match_column="$2" match_value="$3" value_column="$4"
            local line
            local -a fields
            while IFS= read -r line; do
              [[ -z "${line}" ]] && continue
              IFS=',' read -r -a fields <<< "${line}"
              if [[ "$(_strip_quotes "${fields[$((match_column - 1))]:-}")" == "${match_value}" ]]; then
                printf '%s\n' "$(_strip_quotes "${fields[$((value_column - 1))]:-}")"
                return 0
              fi
            done <<< "${csv}"
          }

          csv_all_values() {
            local csv="$1" match_column="$2" match_value="$3" value_column="$4"
            local line
            local -a fields
            while IFS= read -r line; do
              [[ -z "${line}" ]] && continue
              IFS=',' read -r -a fields <<< "${line}"
              if [[ "$(_strip_quotes "${fields[$((match_column - 1))]:-}")" == "${match_value}" ]]; then
                printf '%s\n' "$(_strip_quotes "${fields[$((value_column - 1))]:-}")"
              fi
            done <<< "${csv}"
          }

          csv_match_count() {
            local csv="$1" match_column="$2" match_value="$3"
            local line count=0
            local -a fields
            while IFS= read -r line; do
              [[ -z "${line}" ]] && continue
              IFS=',' read -r -a fields <<< "${line}"
              if [[ "$(_strip_quotes "${fields[$((match_column - 1))]:-}")" == "${match_value}" ]]; then
                count=$((count + 1))
              fi
            done <<< "${csv}"
            printf '%s\n' "${count}"
          }

          csv_row_count() {
            local line count=0
            while IFS= read -r line; do
              [[ -n "${line}" ]] && count=$((count + 1))
            done <<< "$1"
            printf '%s\n' "${count}"
          }

          level0_rows() {
            local line
            local -a fields
            while IFS= read -r line; do
              [[ -z "${line}" ]] && continue
              IFS=',' read -r -a fields <<< "${line}"
              if [[ "$(_strip_quotes "${fields[5]:-}")" == "0" ]]; then
                printf '%s\n' "${line}"
              fi
            done <<< "$1"
          }

          csv_unexpected_top_names() {
            local csv="$1" forms_display_name="$2" line name
            local -a fields
            while IFS= read -r line; do
              [[ -z "${line}" ]] && continue
              IFS=',' read -r -a fields <<< "${line}"
              name="$(_strip_quotes "${fields[1]:-}")"
              case "${name}" in
                Cookie|Kerberos|"Identity Provider Redirector"|"${forms_display_name}") ;;
                *) printf '%s\n' "${name}" ;;
              esac
            done <<< "${csv}"
          }

          urlencode_path() {
            local s="$1" i c out=""
            local LC_ALL=C
            for (( i = 0; i < ${#s}; i++ )); do
              c="${s:i:1}"
              case "${c}" in
                [A-Za-z0-9._~-]) out+="${c}" ;;
                *) out+="$(printf '%%%02X' "'${c}")" ;;
              esac
            done
            printf '%s' "${out}"
          }

          browser_flow="browser-with-conditional-otp"
          forms_display_name="${browser_flow} forms"
          conditional_otp_display_name="${browser_flow} Browser - Conditional OTP"

          reconcile_browser_flow() {
            local top_executions stray_ids stray_id forms_execution_id forms_flow_id forms_flow_alias
            local forms_executions username_password_id conditional_otp_execution_id conditional_otp_flow_id
            local conditional_otp_flow_alias role_condition_id otp_form_id role_config_csv role_config_id _exec_csv
            local top_execution_count unexpected_top_execution forms_requirement username_password_requirement
            local cookie_count kerberos_count idp_redirector_count forms_count all_executions

            all_executions="$(/opt/keycloak/bin/kcadm.sh get \
              "authentication/flows/${browser_flow}/executions" \
              -r "${KC_REALM}" \
              --fields id,displayName,requirement,authenticationFlow,flowId,level --format csv)"
            top_executions="$(level0_rows "${all_executions}")"

            stray_ids="$(csv_all_values "${top_executions}" 2 "otp-conditional-subflow" 1)"
            while IFS= read -r stray_id; do
              if [[ -n "${stray_id}" ]]; then
                echo "Deleting stray top-level otp-conditional-subflow execution"
                /opt/keycloak/bin/kcadm.sh delete \
                  "authentication/executions/${stray_id}" \
                  -r "${KC_REALM}"
              fi
            done <<< "${stray_ids}"

            all_executions="$(/opt/keycloak/bin/kcadm.sh get \
              "authentication/flows/${browser_flow}/executions" \
              -r "${KC_REALM}" \
              --fields id,displayName,requirement,authenticationFlow,flowId,level --format csv)"
            top_executions="$(level0_rows "${all_executions}")"
            top_execution_count="$(csv_row_count "${top_executions}")"
            unexpected_top_execution="$(csv_unexpected_top_names "${top_executions}" "${forms_display_name}")"
            if [[ -n "${unexpected_top_execution}" ]]; then
              echo "ERROR: browser flow has unexpected level-0 executions after reconciliation: ${unexpected_top_execution}" >&2
              return 1
            fi
            if [[ "${top_execution_count}" != "4" ]]; then
              echo "ERROR: browser flow has ${top_execution_count} level-0 executions after reconciliation, expected 4" >&2
              return 1
            fi
            cookie_count="$(csv_match_count "${top_executions}" 2 "Cookie")"
            kerberos_count="$(csv_match_count "${top_executions}" 2 "Kerberos")"
            idp_redirector_count="$(csv_match_count "${top_executions}" 2 "Identity Provider Redirector")"
            forms_count="$(csv_match_count "${top_executions}" 2 "${forms_display_name}")"
            if [[ "${cookie_count}" != "1" || "${kerberos_count}" != "1" || "${idp_redirector_count}" != "1" || "${forms_count}" != "1" ]]; then
              echo "ERROR: browser flow does not contain exactly the required level-0 executions" >&2
              return 1
            fi

            forms_execution_id="$(csv_value "${top_executions}" 2 "${forms_display_name}" 1)"
            forms_flow_id="$(csv_value "${top_executions}" 2 "${forms_display_name}" 5)"
            if [[ -z "${forms_execution_id}" || -z "${forms_flow_id}" ]]; then
              echo "ERROR: browser flow is missing its level-0 forms subflow" >&2
              return 1
            fi
            /opt/keycloak/bin/kcadm.sh update \
              "authentication/flows/${browser_flow}/executions" \
              -r "${KC_REALM}" \
              -b "{\"id\":\"${forms_execution_id}\",\"requirement\":\"ALTERNATIVE\",\"authenticationFlow\":true,\"displayName\":\"${forms_display_name}\"}"

            forms_flow_alias="$(urlencode_path "${forms_display_name}")"

            forms_executions="$(/opt/keycloak/bin/kcadm.sh get \
              "authentication/flows/${forms_flow_alias}/executions" \
              -r "${KC_REALM}" \
              --fields id,displayName,providerId,requirement,authenticationFlow,flowId --format csv)"
            username_password_id="$(csv_value "${forms_executions}" 2 "Username Password Form" 1)"
            conditional_otp_execution_id="$(csv_value "${forms_executions}" 2 "${conditional_otp_display_name}" 1)"
            conditional_otp_flow_id="$(csv_value "${forms_executions}" 2 "${conditional_otp_display_name}" 6)"
            if [[ -z "${username_password_id}" || -z "${conditional_otp_execution_id}" || -z "${conditional_otp_flow_id}" ]]; then
              echo "ERROR: forms subflow is missing Username Password Form or Browser - Conditional OTP" >&2
              return 1
            fi
            /opt/keycloak/bin/kcadm.sh update "authentication/executions/${username_password_id}" \
              -r "${KC_REALM}" -s requirement=REQUIRED
            /opt/keycloak/bin/kcadm.sh update \
              "authentication/flows/${forms_flow_alias}/executions" \
              -r "${KC_REALM}" \
              -b "{\"id\":\"${conditional_otp_execution_id}\",\"requirement\":\"CONDITIONAL\",\"authenticationFlow\":true,\"displayName\":\"${conditional_otp_display_name}\"}"

            conditional_otp_flow_alias="$(urlencode_path "${conditional_otp_display_name}")"

            _exec_csv="$(/opt/keycloak/bin/kcadm.sh get \
              "authentication/flows/${conditional_otp_flow_alias}/executions" \
              -r "${KC_REALM}" --fields id,providerId --format csv \
              )"
            role_condition_id="$(csv_value "${_exec_csv}" 2 "conditional-user-role" 1)"
            if [[ -z "${role_condition_id}" ]]; then
              /opt/keycloak/bin/kcadm.sh create \
                "authentication/flows/${conditional_otp_flow_alias}/executions/execution" \
                -r "${KC_REALM}" -s provider=conditional-user-role
              _exec_csv="$(/opt/keycloak/bin/kcadm.sh get \
                "authentication/flows/${conditional_otp_flow_alias}/executions" \
                -r "${KC_REALM}" --fields id,providerId --format csv \
                )"
              role_condition_id="$(csv_value "${_exec_csv}" 2 "conditional-user-role" 1)"
            fi
            if [[ -z "${role_condition_id}" ]]; then
              echo "ERROR: could not resolve conditional-user-role execution ID" >&2
              return 1
            fi
            role_config_csv="$(/opt/keycloak/bin/kcadm.sh get \
              "authentication/flows/${conditional_otp_flow_alias}/executions" \
              -r "${KC_REALM}" --fields id,providerId,authenticationConfig --format csv)"
            role_config_id="$(csv_value "${role_config_csv}" 2 "conditional-user-role" 3)"
            if [[ -n "${role_config_id}" ]]; then
              /opt/keycloak/bin/kcadm.sh update "authentication/config/${role_config_id}" \
                -r "${KC_REALM}" \
                -s alias=platform-mfa-role-condition \
                -s 'config={"conditionRoleAlias":"platform-mfa","negate":"false"}'
            else
              /opt/keycloak/bin/kcadm.sh create \
                "authentication/executions/${role_condition_id}/config" \
                -r "${KC_REALM}" \
                -s alias=platform-mfa-role-condition \
                -s 'config={"conditionRoleAlias":"platform-mfa","negate":"false"}'
            fi
            /opt/keycloak/bin/kcadm.sh update "authentication/executions/${role_condition_id}" \
              -r "${KC_REALM}" -s requirement=REQUIRED

            _exec_csv="$(/opt/keycloak/bin/kcadm.sh get \
              "authentication/flows/${conditional_otp_flow_alias}/executions" \
              -r "${KC_REALM}" --fields id,providerId --format csv \
              )"
            otp_form_id="$(csv_value "${_exec_csv}" 2 "auth-otp-form" 1)"
            if [[ -z "${otp_form_id}" ]]; then
              echo "ERROR: Browser - Conditional OTP subflow is missing OTP Form" >&2
              return 1
            fi
            /opt/keycloak/bin/kcadm.sh update "authentication/executions/${otp_form_id}" \
              -r "${KC_REALM}" -s requirement=REQUIRED

            all_executions="$(/opt/keycloak/bin/kcadm.sh get \
              "authentication/flows/${browser_flow}/executions" \
              -r "${KC_REALM}" \
              --fields id,displayName,requirement,authenticationFlow,flowId,level --format csv)"
            top_executions="$(level0_rows "${all_executions}")"
            top_execution_count="$(csv_row_count "${top_executions}")"
            if [[ "${top_execution_count}" != "4" ]]; then
              echo "ERROR: browser flow still has stray level-0 executions after reconciliation" >&2
              return 1
            fi
            forms_requirement="$(csv_value "${top_executions}" 2 "${forms_display_name}" 3)"
            forms_executions="$(/opt/keycloak/bin/kcadm.sh get \
              "authentication/flows/${forms_flow_alias}/executions" \
              -r "${KC_REALM}" \
              --fields id,displayName,providerId,requirement,authenticationFlow,flowId --format csv)"
            username_password_requirement="$(csv_value "${forms_executions}" 2 "Username Password Form" 4)"
            if [[ "${forms_requirement}" != "ALTERNATIVE" || "${username_password_requirement}" != "REQUIRED" ]]; then
              echo "ERROR: browser flow requirements could not be restored" >&2
              return 1
            fi
          }

          if /opt/keycloak/bin/kcadm.sh get "authentication/flows" \
               -r "${KC_REALM}" 2>/dev/null \
             | grep -q '"browser-with-conditional-otp"'; then
            echo "browser-with-conditional-otp flow already exists; reconciling it"
          else
            echo "Creating browser-with-conditional-otp flow..."

            /opt/keycloak/bin/kcadm.sh create "authentication/flows/browser/copy" \
              -r "${KC_REALM}" -s "newName=${browser_flow}"
          fi
          reconcile_browser_flow
          echo "browser-with-conditional-otp flow reconciled"
          /opt/keycloak/bin/kcadm.sh update "realms/${KC_REALM}" \
            -s browserFlow=browser-with-conditional-otp
          echo "browser-with-conditional-otp flow activated"

          ldap_id="$(
            /opt/keycloak/bin/kcadm.sh get components \
              -r "${KC_REALM}" \
              -q type=org.keycloak.storage.UserStorageProvider \
              --fields id \
              2>/dev/null \
            | grep '"id"' | head -1 \
            | sed 's/.*"id" : "\([^"]*\)".*/\1/' || true
          )"

          if [ -z "${ldap_id}" ]; then
            echo "No LDAP UserStorageProvider in realm ${KC_REALM}; creating it from the rendered realm"
            _usp_file="/tmp/ldap-userstorageprovider.json"
            sed -n '/^    "org\.keycloak\.storage\.UserStorageProvider": \[$/,/^    \]$/p' \
              /tmp/realm-shopping-cart.rendered.json \
              | sed -e '1d' -e '$d' \
                    -e 's|^        "providerId": "ldap",$|        "providerId": "ldap",\n        "providerType": "org.keycloak.storage.UserStorageProvider",|' \
              > "${_usp_file}"
            if [ ! -s "${_usp_file}" ]; then
              echo "ERROR: could not extract the LDAP UserStorageProvider block from the rendered realm" >&2
              exit 1
            fi
            /opt/keycloak/bin/kcadm.sh create components \
              -r "${KC_REALM}" -f "${_usp_file}" >/dev/null
            rm -f "${_usp_file}"
            ldap_id="$(
              /opt/keycloak/bin/kcadm.sh get components \
                -r "${KC_REALM}" \
                -q type=org.keycloak.storage.UserStorageProvider \
                --fields id \
                2>/dev/null \
              | grep '"id"' | head -1 \
              | sed 's/.*"id" : "\([^"]*\)".*/\1/' || true
            )"
          fi

          if [ -z "${ldap_id}" ]; then
            echo "ERROR: realm ${KC_REALM} still has no LDAP UserStorageProvider after create attempt; refusing to continue with no user store" >&2
            exit 1
          fi

          if [ -n "${ldap_id}" ]; then
            PT="org.keycloak.storage.ldap.mappers.LDAPStorageMapper"

            create_mapper_if_missing() {
              local name="$1"
              local ldap_attribute="$2"
              local model_attribute="$3"
              local always_read="$4"
              local mandatory="$5"
              local existing mapper_file
              existing="$(
                /opt/keycloak/bin/kcadm.sh get components \
                  -r "${KC_REALM}" \
                  -q parent="${ldap_id}" \
                  -q type=org.keycloak.storage.ldap.mappers.LDAPStorageMapper \
                  -q name="${name}" \
                  --fields id \
                  2>/dev/null \
                | grep -c '"id"' || true
              )"

              if [ "${existing}" -gt 0 ]; then
                echo "LDAP mapper already exists: ${name}"
                return 0
              fi

              mapper_file="$(mktemp /tmp/keycloak-ldap-mapper-XXXXXX.json)"
              cat > "${mapper_file}" <<EOF
          {"parentId":"${ldap_id}","providerType":"${PT}","providerId":"user-attribute-ldap-mapper","name":"${name}","config":{"ldap.attribute":["${ldap_attribute}"],"user.model.attribute":["${model_attribute}"],"read.only":["true"],"always.read.value.from.ldap":["${always_read}"],"is.mandatory.in.ldap":["${mandatory}"]}}
          EOF
              /opt/keycloak/bin/kcadm.sh create components -r "${KC_REALM}" -f "${mapper_file}" >/dev/null
              rm -f "${mapper_file}"
              echo "Created LDAP mapper: ${name}"
            }

            create_mapper_if_missing "username" "uid" "username" "false" "true"
            create_mapper_if_missing "email" "mail" "email" "false" "false"
            create_mapper_if_missing "first name" "givenName" "firstName" "true" "true"
            create_mapper_if_missing "last name" "sn" "lastName" "true" "true"
            create_mapper_if_missing "creation date" "createTimestamp" "createTimestamp" "true" "false"
            create_mapper_if_missing "modify date" "modifyTimestamp" "modifyTimestamp" "true" "false"

            _gm_existing="$(
              /opt/keycloak/bin/kcadm.sh get components \
                -r "${KC_REALM}" \
                -q parent="${ldap_id}" \
                -q type=org.keycloak.storage.ldap.mappers.LDAPStorageMapper \
                -q name="group-mapper" \
                --fields id \
                2>/dev/null \
              | grep -c '"id"' || true
            )"
            if [ "${_gm_existing}" -gt 0 ]; then
              echo "LDAP group mapper already exists"
            else
              _gm_file="$(mktemp /tmp/keycloak-group-mapper-XXXXXX.json)"
              cat > "${_gm_file}" <<EOF
          {"parentId":"${ldap_id}","providerType":"org.keycloak.storage.ldap.mappers.LDAPStorageMapper","providerId":"group-ldap-mapper","name":"group-mapper","config":{"groups.dn":["ou=groups,dc=home,dc=org"],"group.name.ldap.attribute":["cn"],"group.object.classes":["groupOfNames"],"preserve.group.inheritance":["true"],"ignore.missing.groups":["false"],"membership.ldap.attribute":["member"],"membership.attribute.type":["DN"],"membership.user.ldap.attribute":["cn"],"mode":["READ_ONLY"],"user.roles.retrieve.strategy":["LOAD_GROUPS_BY_MEMBER_ATTRIBUTE"],"memberof.ldap.attribute":["memberOf"],"drop.non.existing.groups.during.sync":["false"]}}
          EOF
              /opt/keycloak/bin/kcadm.sh create components -r "${KC_REALM}" -f "${_gm_file}" >/dev/null
              rm -f "${_gm_file}"
              echo "Created LDAP group mapper"
            fi
            _gm_id="$(
              /opt/keycloak/bin/kcadm.sh get components \
                -r "${KC_REALM}" \
                -q parent="${ldap_id}" \
                -q type=org.keycloak.storage.ldap.mappers.LDAPStorageMapper \
                -q name="group-mapper" \
                --fields id \
                2>/dev/null \
              | grep '"id"' | head -1 \
              | sed 's/.*"id" : "\([^"]*\)".*/\1/' || true
            )"
            if [ -n "${_gm_id}" ]; then
              /opt/keycloak/bin/kcadm.sh create \
                "user-storage/${ldap_id}/mappers/${_gm_id}/sync?direction=fedToKeycloak" \
                -r "${KC_REALM}" >/dev/null
              echo "LDAP group sync complete"
            fi

            /opt/keycloak/bin/kcadm.sh create \
              "user-storage/${ldap_id}/sync?action=triggerFullSync" \
              -r "${KC_REALM}" >/dev/null
          else
            echo "ERROR: LDAP component id unexpectedly empty" >&2
            exit 1
          fi
        envFrom:
        - configMapRef:
            name: keycloak-config
        - secretRef:
            name: keycloak-secrets
        env:
        - name: ARGOCD_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: keycloak-client-secrets
              key: argocd-client-secret
        - name: ORDER_SERVICE_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: keycloak-client-secrets
              key: order-service-client-secret
        - name: PRODUCT_CATALOG_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: keycloak-client-secrets
              key: product-catalog-client-secret
        - name: GRAFANA_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: keycloak-client-secrets
              key: grafana-client-secret
        volumeMounts:
        - name: keycloak-realm-import
          mountPath: /realm
          readOnly: true
