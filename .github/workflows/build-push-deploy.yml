name: Build, Scan, Push, Deploy

on:
  workflow_call:
    inputs:
      service-name:
        required: true
        type: string
      image-name:
        required: true
        type: string
      dockerfile:
        required: false
        type: string
        default: ''
      context:
        required: false
        type: string
        default: .
      build-args:
        required: false
        type: string
        default: ''
    secrets:
      PACKAGES_TOKEN:
        required: false
      PROMOTER_SSH_KEY:
        required: false
      COSIGN_KEY:
        required: false
      COSIGN_PASSWORD:
        required: false

jobs:
  build-push:
    runs-on: ubuntu-latest
    env:
      COSIGN_KEY: ${{ secrets.COSIGN_KEY }}
    permissions:
      contents: write
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Resolve Dockerfile path
        id: resolve-dockerfile
        shell: bash
        env:
          BUILD_CONTEXT: ${{ inputs.context }}
          REQUESTED_DOCKERFILE: ${{ inputs.dockerfile }}
        run: |
          if [[ -n "${REQUESTED_DOCKERFILE}" ]]; then
            printf 'path=%s\n' "${REQUESTED_DOCKERFILE}" >> "${GITHUB_OUTPUT}"
          else
            printf 'path=%s/Dockerfile\n' "${BUILD_CONTEXT%/}" >> "${GITHUB_OUTPUT}"
          fi

      - name: Build image
        uses: docker/build-push-action@v5
        with:
          context: ${{ inputs.context }}
          file: ${{ steps.resolve-dockerfile.outputs.path }}
          push: false
          load: true
          tags: ${{ inputs.image-name }}:sha-${{ github.sha }}
          build-args: ${{ inputs.build-args }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          secrets: |
            GH_TOKEN=${{ secrets.PACKAGES_TOKEN }}

      - name: Scan image (Trivy)
        uses: aquasecurity/trivy-action@v0.35.0
        continue-on-error: true
        with:
          image-ref: ${{ inputs.image-name }}:sha-${{ github.sha }}
          severity: CRITICAL,HIGH
          exit-code: 0
          ignore-unfixed: true
          format: table

      - name: Login to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image
        id: push
        uses: docker/build-push-action@v5
        with:
          context: ${{ inputs.context }}
          file: ${{ steps.resolve-dockerfile.outputs.path }}
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ inputs.image-name }}:sha-${{ github.sha }}
            ${{ inputs.image-name }}:latest
          build-args: ${{ inputs.build-args }}
          cache-from: type=gha
          secrets: |
            GH_TOKEN=${{ secrets.PACKAGES_TOKEN }}

      - name: Install cosign
        if: env.COSIGN_KEY != ''
        uses: sigstore/cosign-installer@v3.7.0

      - name: Sign image by digest
        if: env.COSIGN_KEY != ''
        env:
          COSIGN_KEY: ${{ secrets.COSIGN_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
          IMAGE_REF: ${{ inputs.image-name }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          cosign sign --yes --key env://COSIGN_KEY "${IMAGE_REF}@${DIGEST}"

      - name: Update image tag in k8s/base/kustomization.yaml
        id: promote
        continue-on-error: true
        run: |
          sed -i "s|newTag:.*|newTag: sha-${{ github.sha }}|" k8s/base/kustomization.yaml
          git config user.name "sc-image-promoter"
          git config user.email "sc-image-promoter@users.noreply.github.com"
          git add k8s/base/kustomization.yaml
          if git diff --cached --quiet; then
            echo "Image tag already matches sha-${{ github.sha }}"
            exit 0
          fi
          git commit -m "ci: update ${{ inputs.service-name }} to sha-${{ github.sha }} [skip ci]"
          install -d -m 700 ~/.ssh
          printf '%s\n' "${PROMOTER_SSH_KEY}" > ~/.ssh/promoter_key
          chmod 600 ~/.ssh/promoter_key
          ssh-keyscan github.com >> ~/.ssh/known_hosts 2>/dev/null
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/promoter_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes"
          git remote set-url origin "git@github.com:${{ github.repository }}.git"
          if ! git push origin "HEAD:${{ github.ref_name }}"; then
            git pull --rebase origin "${{ github.ref_name }}"
            git push origin "HEAD:${{ github.ref_name }}"
          fi
        env:
          PROMOTER_SSH_KEY: ${{ secrets.PROMOTER_SSH_KEY }}

      - name: Fail when image promotion did not complete
        if: steps.promote.outcome == 'failure'
        run: exit 1
