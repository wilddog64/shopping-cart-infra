name: Build, Scan, Push, Deploy

on:
  workflow_call:
    inputs:
      service-name:
        required: true
        type: string
      image-name:
        required: true
        type: string
      dockerfile:
        required: false
        type: string
        default: ''
      context:
        required: false
        type: string
        default: .
      build-args:
        required: false
        type: string
        default: ''
    secrets:
      PACKAGES_TOKEN:
        required: false

jobs:
  build-push:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Resolve Dockerfile path
        id: resolve-dockerfile
        shell: bash
        env:
          BUILD_CONTEXT: ${{ inputs.context }}
          REQUESTED_DOCKERFILE: ${{ inputs.dockerfile }}
        run: |
          if [[ -n "${REQUESTED_DOCKERFILE}" ]]; then
            printf 'path=%s\n' "${REQUESTED_DOCKERFILE}" >> "${GITHUB_OUTPUT}"
          else
            printf 'path=%s/Dockerfile\n' "${BUILD_CONTEXT%/}" >> "${GITHUB_OUTPUT}"
          fi

      - name: Build image
        uses: docker/build-push-action@v5
        with:
          context: ${{ inputs.context }}
          file: ${{ steps.resolve-dockerfile.outputs.path }}
          push: false
          load: true
          tags: ${{ inputs.image-name }}:sha-${{ github.sha }}
          build-args: ${{ inputs.build-args }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          secrets: |
            GH_TOKEN=${{ secrets.PACKAGES_TOKEN }}

      - name: Scan image (Trivy)
        uses: aquasecurity/trivy-action@v0.35.0
        continue-on-error: true
        with:
          image-ref: ${{ inputs.image-name }}:sha-${{ github.sha }}
          severity: CRITICAL,HIGH
          exit-code: 0
          ignore-unfixed: true
          format: table

      - name: Login to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image
        uses: docker/build-push-action@v5
        with:
          context: ${{ inputs.context }}
          file: ${{ steps.resolve-dockerfile.outputs.path }}
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ inputs.image-name }}:sha-${{ github.sha }}
            ${{ inputs.image-name }}:latest
          build-args: ${{ inputs.build-args }}
          cache-from: type=gha
          secrets: |
            GH_TOKEN=${{ secrets.PACKAGES_TOKEN }}

      - name: Update image tag in k8s/base/kustomization.yaml
        id: promote
        continue-on-error: true
        run: |
          sed -i "s|newTag:.*|newTag: sha-${{ github.sha }}|" k8s/base/kustomization.yaml
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add k8s/base/kustomization.yaml
          if git diff --cached --quiet; then
            echo "Image tag already matches sha-${{ github.sha }}"
            exit 0
          fi
          git commit -m "ci: update ${{ inputs.service-name }} to sha-${{ github.sha }}"
          branch="ci/deploy-${{ inputs.service-name }}-${{ github.sha }}"
          git push origin "HEAD:${branch}"
          pr_url=$(gh pr create --base main --head "${branch}" \
            --title "ci: deploy ${{ inputs.service-name }} sha-${{ github.sha }}" \
            --body "Automated image promotion for ${{ inputs.service-name }}.")
          pr_number="${pr_url##*/}"
          gh pr merge --auto --squash "${pr_number}"
          for _attempt in $(seq 1 30); do
            state=$(gh pr view "${pr_number}" --json state --jq .state)
            [ "${state}" = "MERGED" ] && exit 0
            [ "${state}" = "CLOSED" ] && exit 1
            sleep 10
          done
          echo "Timed out waiting for promotion PR ${pr_url} to merge" >&2
          exit 1
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Fail when image promotion did not complete
        if: steps.promote.outcome == 'failure'
        run: exit 1
