name: Build and sign MinIO image uploader

on:
  push:
    branches:
      - main
    paths:
      - data-layer/minio/uploader/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-push-sign:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        id: push
        uses: docker/build-push-action@v5
        with:
          context: data-layer/minio/uploader
          push: true
          platforms: linux/amd64
          tags: |
            ghcr.io/wilddog64/minio-image-uploader:sha-${{ github.sha }}
            ghcr.io/wilddog64/minio-image-uploader:1.0.0

      - name: Verify COSIGN_KEY was provided
        env:
          COSIGN_KEY: ${{ secrets.COSIGN_KEY }}
        run: |
          if [ -n "$COSIGN_KEY" ]; then
            exit 0
          fi
          echo "COSIGN_KEY is empty; refusing to publish an unsigned image" >&2
          exit 1

      - name: Install cosign
        uses: sigstore/cosign-installer@v3.7.0

      - name: Sign image by digest
        env:
          COSIGN_KEY: ${{ secrets.COSIGN_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
          IMAGE_REF: ghcr.io/wilddog64/minio-image-uploader
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          cosign sign --yes --key env://COSIGN_KEY "${IMAGE_REF}@${DIGEST}"
