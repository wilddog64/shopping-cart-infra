name: Build and sign MinIO image uploader

on:
  push:
    branches:
      - main
    paths:
      - data-layer/minio/uploader/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-push-sign:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Verify COSIGN_KEY was provided
        env:
          COSIGN_KEY: ${{ secrets.COSIGN_KEY }}
        run: |
          if [ -n "$COSIGN_KEY" ]; then
            exit 0
          fi
          echo "COSIGN_KEY is empty; refusing to publish an unsigned image" >&2
          exit 1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Read uploader version
        id: version
        env:
          IMAGE_REF: ghcr.io/wilddog64/minio-image-uploader
        run: |
          version="$(tr -d '[:space:]' < data-layer/minio/uploader/VERSION)"
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "data-layer/minio/uploader/VERSION must be MAJOR.MINOR.PATCH, got '${version}'" >&2
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          if docker buildx imagetools inspect "${IMAGE_REF}:${version}" >/dev/null 2>&1; then
            echo "::warning::${IMAGE_REF}:${version} is already published; bump data-layer/minio/uploader/VERSION to publish a new image"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push image
        id: push
        if: steps.version.outputs.publish == 'true'
        uses: docker/build-push-action@v5
        with:
          context: data-layer/minio/uploader
          push: true
          platforms: linux/amd64
          tags: |
            ghcr.io/wilddog64/minio-image-uploader:sha-${{ github.sha }}
            ghcr.io/wilddog64/minio-image-uploader:${{ steps.version.outputs.version }}

      - name: Install cosign
        if: steps.version.outputs.publish == 'true'
        uses: sigstore/cosign-installer@v3.7.0

      - name: Sign image by digest
        if: steps.version.outputs.publish == 'true'
        env:
          COSIGN_KEY: ${{ secrets.COSIGN_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
          IMAGE_REF: ghcr.io/wilddog64/minio-image-uploader
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          cosign sign --yes --key env://COSIGN_KEY "${IMAGE_REF}@${DIGEST}"
