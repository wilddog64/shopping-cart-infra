---
apiVersion: v1
kind: Service
metadata:
  name: minio
  namespace: shopping-cart-data
  labels:
    app.kubernetes.io/name: minio
    app.kubernetes.io/instance: product-images
    app.kubernetes.io/component: object-store
    app.kubernetes.io/part-of: shopping-cart
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: minio
    app.kubernetes.io/instance: product-images
  ports:
    - name: api
      port: 9000
      targetPort: api
      protocol: TCP
    - name: console
      port: 9001
      targetPort: console
      protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: minio-nodeport
  namespace: shopping-cart-data
  labels:
    app.kubernetes.io/name: minio
    app.kubernetes.io/instance: product-images
    app.kubernetes.io/component: object-store
    app.kubernetes.io/part-of: shopping-cart
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: minio
    app.kubernetes.io/instance: product-images
  ports:
    - name: api
      port: 9000
      targetPort: api
      nodePort: 30900
      protocol: TCP
    - name: console
      port: 9001
      targetPort: console
      nodePort: 30901
      protocol: TCP
