---
apiVersion: batch/v1
kind: Job
metadata:
  name: minio-image-upload
  namespace: shopping-cart-data
  labels:
    app.kubernetes.io/name: minio
    app.kubernetes.io/component: image-upload
    app.kubernetes.io/part-of: shopping-cart
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: HookSucceeded
    argocd.argoproj.io/hook-weight: "1"
spec:
  ttlSecondsAfterFinished: 300
  backoffLimit: 3
  template:
    metadata:
      labels:
        app.kubernetes.io/name: minio
        app.kubernetes.io/component: image-upload
        app.kubernetes.io/part-of: shopping-cart
    spec:
      restartPolicy: OnFailure
      initContainers:
        - name: copy-mc
          image: quay.io/minio/mc:RELEASE.2024-11-05T11-29-45Z
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - cp /usr/bin/mc /shared/mc
          volumeMounts:
            - name: shared
              mountPath: /shared
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
      containers:
        - name: uploader
          image: python:3.12-alpine
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              pip install --quiet Pillow
              python3 /scripts/generate-and-upload.py
          env:
            - name: MC_BIN
              value: /shared/mc
            - name: MC_CONFIG_DIR
              value: /tmp/.mc
            - name: MINIO_ENDPOINT
              value: http://minio.shopping-cart-data.svc.cluster.local:9000
            - name: MINIO_BUCKET
              value: product-images
          envFrom:
            - secretRef:
                name: minio-credentials
          volumeMounts:
            - name: shared
              mountPath: /shared
            - name: scripts
              mountPath: /scripts
            - name: tmp
              mountPath: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop: [ALL]
      volumes:
        - name: shared
          emptyDir: {}
        - name: tmp
          emptyDir: {}
        - name: scripts
          configMap:
            name: minio-image-upload-script
