---
apiVersion: batch/v1
kind: Job
metadata:
  name: minio-image-upload
  namespace: shopping-cart-data
  labels:
    app.kubernetes.io/name: minio
    app.kubernetes.io/component: image-upload
    app.kubernetes.io/part-of: shopping-cart
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
    argocd.argoproj.io/hook-weight: "1"
spec:
  activeDeadlineSeconds: 600
  ttlSecondsAfterFinished: 300
  backoffLimit: 3
  template:
    metadata:
      labels:
        app.kubernetes.io/name: minio
        app.kubernetes.io/component: image-upload
        app.kubernetes.io/part-of: shopping-cart
    spec:
      restartPolicy: OnFailure
      initContainers:
        - name: copy-mc
          image: docker.io/bitnamilegacy/minio-client:2024.11.5-debian-12-r1@sha256:e25c5897d46782439d75874e49ad54b606f2b8b2f51128afaec9ae8cf7903806
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - cp /opt/bitnami/minio-client/bin/mc /shared/mc
          volumeMounts:
            - name: shared
              mountPath: /shared
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
      containers:
        - name: uploader
          image: ghcr.io/wilddog64/minio-image-uploader:1.0.0@sha256:f152ceb0e3293888372fc43fe0e8a87bbcea3d1fb1e1dba7bcc599596b72657d
          imagePullPolicy: IfNotPresent
          command:
            - python3
            - /scripts/generate-and-upload.py
          env:
            - name: MC_BIN
              value: /shared/mc
            - name: MC_CONFIG_DIR
              value: /tmp/.mc
            - name: MINIO_ENDPOINT
              value: http://minio.shopping-cart-data.svc.cluster.local:9000
            - name: MINIO_BUCKET
              value: product-images
          envFrom:
            - secretRef:
                name: minio-credentials
          volumeMounts:
            - name: shared
              mountPath: /shared
            - name: scripts
              mountPath: /scripts
            - name: tmp
              mountPath: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop: [ALL]
      volumes:
        - name: shared
          emptyDir: {}
        - name: tmp
          emptyDir: {}
        - name: scripts
          configMap:
            name: minio-image-upload-script
