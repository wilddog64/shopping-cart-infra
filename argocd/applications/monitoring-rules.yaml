apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: shopping-cart-rules
  namespace: cicd
  labels:
    app.kubernetes.io/part-of: shopping-cart
    managed-by: k3d-manager
spec:
  project: shopping-cart
  source:
    repoURL: https://github.com/wilddog64/shopping-cart-infra.git
    targetRevision: HEAD
    path: monitoring/rules
    directory:
      recurse: false
      include: "shopping-cart-apps.yaml"
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
